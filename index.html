<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>راديو يا صور | من صور لكل لبنان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --b: #00d2ff; --p: #7b2cbf; --bg: #060b19; }
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Cairo', sans-serif; 
    /* منع تحديد النصوص والصور */
    user-select: none; 
    -webkit-user-select: none;
    /* إزالة تأثير الضغط الأزرق على الموبايل */
    -webkit-tap-highlight-color: transparent; 
}

body { 
    /* تم تعديل الخلفية هنا: إضافة الصورة مع طبقة تعتيم لضمان وضوح النصوص */
    background-color: var(--bg);
    background-image: linear-gradient(rgba(6, 11, 25, 0.7), rgba(6, 11, 25, 0.7)), url('https://www.yasour.org/Upload/ads/0/0/82.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    /* تثبيت الصفحة تماماً */
    position: fixed; 
    inset: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    color: #fff; 
    overflow: hidden; 
    /* منع ارتداد الشاشة على الموبايل */
    overscroll-behavior: none; 
}

/* خلفية متحركة (توهج) */
body::before, body::after { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(80px); z-index: -1; pointer-events: none; }
body::before { background: rgba(0, 210, 255, 0.15); top: -50px; left: -50px; animation: floatBg 8s infinite alternate; }
body::after { background: rgba(123, 44, 191, 0.15); bottom: -50px; right: -50px; animation: floatBg 10s infinite alternate-reverse; }
@keyframes floatBg { 100% { transform: translate(50px, 50px); } }

.app { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 2rem; padding: 2.5rem 2rem; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

/* الشعار */
.logo { width: 130px; height: 130px; border-radius: 50%; background: #fff; padding: 4px; margin: 0 auto 15px; position: relative; animation: float 4s ease-in-out infinite; box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); pointer-events: none; }
.logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* النصوص */
h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(90deg, var(--b), var(--p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px; }
.slogan { font-size: 0.95rem; color: #cbd5e1; font-weight: 700; letter-spacing: 1px; margin-bottom: 1.5rem; position: relative; display: inline-block; }
.slogan::after { content: ''; position: absolute; bottom: -6px; left: 20%; width: 60%; height: 2px; background: linear-gradient(90deg, transparent, var(--b), transparent); }

/* حالة البث */
#status { color: #aaa; font-size: 0.85rem; margin-bottom: 15px; transition: 0.3s; }
#status.live { color: #10b981; font-weight: bold; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

/* موجة الصوت */
.vis { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 30px; margin-bottom: 25px; }
.bar { width: 5px; background: linear-gradient(to top, var(--p), var(--b)); border-radius: 3px; height: 10%; transition: 0.3s; }
.playing .bar { animation: bounce 0.6s infinite alternate; }
.playing .bar:nth-child(2) { animation-delay: 0.15s; }
.playing .bar:nth-child(3) { animation-delay: 0.3s; }
.playing .bar:nth-child(4) { animation-delay: 0.1s; }
.playing .bar:nth-child(5) { animation-delay: 0.25s; }
@keyframes bounce { to { height: 100%; } }

/* زر التشغيل */
.btn-wrap { position: relative; display: inline-block; margin-bottom: 15px; }
button { width: 80px; height: 80px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--b), var(--p)); color: #fff; font-size: 2rem; cursor: pointer; box-shadow: 0 10px 20px rgba(0,210,255,0.3); transition: 0.3s; padding-right: 5px; position: relative; z-index: 2; touch-action: manipulation; }
button:hover { transform: scale(1.05); box-shadow: 0 15px 25px rgba(123,44,191,0.5); }
button:active { transform: scale(0.95); }
/* تأثير النبض عند التشغيل */
.playing .btn-wrap::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: var(--p); z-index: 1; animation: ripple 1.5s infinite; }
@keyframes ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }

/* شريط الصوت */
.vol-box { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 15px; }
.vol-box i { cursor: pointer; color: #718096; font-size: 1.1rem; transition: 0.2s; padding: 5px; }
.vol-box i:hover { color: var(--b); transform: scale(1.2); }
input[type="range"] { -webkit-appearance: none; width: 65%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 5px; outline: none; touch-action: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--b); cursor: pointer; box-shadow: 0 0 10px var(--b); transition: 0.2s; }
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

/* تنسيق الإصدار */
.version { font-size: 0.7rem; color: rgba(255, 255, 255, 0.3); margin-top: 20px; font-weight: 400; letter-spacing: 1px; }

audio { display: none; }
</style>
</head>
<body>

<div class="app">
    <div class="logo"><img src="https://www.yasour.org/themes/yas/assets/images/logo2.png" alt="شعار راديو يا صور"></div>
    <h1>راديو يا صور</h1>
    <p class="slogan">من صور لكل لبنان</p>
    
    <div id="status">متوقف</div>
    
    <div class="vis" id="vis">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    
    <div class="btn-wrap">
        <button id="btn"><i class="fas fa-play" id="icon"></i></button>
    </div>
    
    <div class="vol-box">
        <i class="fas fa-volume-down" onclick="changeVol(-0.1)"></i>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
        <i class="fas fa-volume-up" onclick="changeVol(0.1)"></i>
    </div>
    
    <!-- إضافة الإصدار هنا -->
    <div class="version">الإصدار 1.0</div>

    <audio id="audio" src="https://yasourfm.radioca.st/stream" preload="none"></audio>
</div>

<script>
const a = document.getElementById('audio'), b = document.getElementById('btn'), i = document.getElementById('icon'), s = document.getElementById('status'), v = document.getElementById('vis'), vol = document.getElementById('vol'), app = document.querySelector('.app');

b.onclick = () => {
    if (a.paused) {
        s.innerText = "جاري التحميل...";
        a.play().then(() => {
            i.className = "fas fa-pause"; s.innerText = "بث مباشر الآن"; s.classList.add('live'); v.classList.add('playing'); app.classList.add('playing'); b.style.paddingRight = '0';
        }).catch(() => { s.innerText = "خطأ في الاتصال"; });
    } else {
        a.pause(); i.className = "fas fa-play"; s.innerText = "متوقف"; s.classList.remove('live'); v.classList.remove('playing'); app.classList.remove('playing'); b.style.paddingRight = '5px';
    }
};

vol.oninput = (e) => a.volume = e.target.value;

function changeVol(step) {
    let newVol = Math.min(1, Math.max(0, parseFloat(vol.value) + step));
    vol.value = newVol;
    a.volume = newVol;
}
</script>

</body>
</html>
